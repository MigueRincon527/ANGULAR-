<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-logo">💪 FitSupps</span>
      <h1>Bienvenido de nuevo</h1>
      <p>Inicia sesión para continuar con tus compras</p>
    </div>

    <div class="auth-error" *ngIf="errorMensaje">
      ⚠️ {{ errorMensaje }}
    </div>

    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

      <div class="campo-form">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="tucorreo@ejemplo.com"
          autocomplete="email"
        />
      </div>

      <div class="campo-form">
        <label for="password">Contraseña</label>
        <div class="input-password">
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="btn-ver-password" (click)="togglePassword()">
            {{ mostrarPassword ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="fila-opciones">
        <label class="checkbox-label">
          <input type="checkbox" name="recordarme" [(ngModel)]="recordarme" />
          Recordarme
        </label>
        <a href="#" class="link-olvide">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="cargando">
        <span *ngIf="!cargando">Iniciar sesión</span>
        <span *ngIf="cargando">Ingresando...</span>
      </button>

      <div class="divisor">
        <span>o continúa con</span>
      </div>

      <button type="button" class="btn-google" (click)="loginConGoogle()">
        <span class="icono-google">G</span>
        Iniciar sesión con Google
      </button>

    </form>

    <p class="auth-footer">
      ¿No tienes una cuenta?
      <a routerLink="/registro">Regístrate aquí</a>
    </p>

  </div>
</div>
